name: Beacon presigned redirect check

on:
  pull_request:
    paths:
      - "lib/procurement/sources/beacon/documents.ts"
      - "lib/procurement/sources/beacon/documents.test.ts"
      - "scripts/beacon-documents.ts"
      - ".github/workflows/beacon-presigned-redirect-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:beacon-documents
