name: Apply understanding reliability patch

on:
  push:
    branches:
      - codex/gemini-35-flash-lite

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply understanding reliability wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gemini-35-flash-lite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: python scripts/apply-understanding-reliability-patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/procurement/understanding/generation.ts .env.example tests/integration/understanding/provider-observability.test.ts
          git commit -m "chore: apply understanding reliability wiring"
          git push origin HEAD:codex/gemini-35-flash-lite
