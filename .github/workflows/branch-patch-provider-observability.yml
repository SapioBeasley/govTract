name: Apply provider observability patch

on:
  push:
    branches:
      - codex/understanding-provider-observability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/understanding-provider-observability

      - name: Apply narrow production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/procurement/understanding/generation.ts")
          text = path.read_text()

          marker = 'const SUMMARY_CHAR_LIMIT = 6_000;\n'
          helper = r'''
const PROVIDER_FAILURE_MESSAGE_LIMIT = 500;

type UnderstandingProviderFailureDiagnostic = {
  provider: string;
  model: string;
  chunkKey: string | null;
  category: "http_error" | "invalid_response" | "provider_error";
  httpStatus: number | null;
  message: string;
};

function sanitizeProviderFailureMessage(value: string) {
  return value
    .replace(/AIza[A-Za-z0-9_-]{10,}/g, "[REDACTED]")
    .replace(/((?:x-goog-api-key|api[_ -]?key)\s*[:=]\s*)[^\s,;]+/gi, "$1[REDACTED]")
    .replace(/\bBearer\s+[A-Za-z0-9._~-]+/gi, "Bearer [REDACTED]")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, PROVIDER_FAILURE_MESSAGE_LIMIT);
}

function describeProviderFailure(input: {
  error: unknown;
  provider: string;
  model: string;
  chunkKey: string | null;
}): UnderstandingProviderFailureDiagnostic {
  const rawMessage = input.error instanceof Error ? input.error.message.trim() : "";
  const providerOwnedMessage = input.provider === "gemini" && rawMessage.startsWith("Gemini ");
  const message = providerOwnedMessage
    ? sanitizeProviderFailureMessage(rawMessage)
    : "Provider request failed.";
  const statusMatch = providerOwnedMessage ? rawMessage.match(/\bHTTP\s+(\d{3})\b/i) : null;
  const httpStatus = statusMatch ? Number(statusMatch[1]) : null;
  const category = httpStatus
    ? "http_error"
    : providerOwnedMessage &&
        /invalid response|invalid JSON|no structured solicitation understanding|invalid solicitation understanding structure/i.test(
          rawMessage,
        )
      ? "invalid_response"
      : "provider_error";

  return {
    provider: input.provider,
    model: input.model,
    chunkKey: input.chunkKey,
    category,
    httpStatus,
    message,
  };
}

function logProviderFailure(input: {
  understandingId: string;
  opportunityId: string;
  diagnostic: UnderstandingProviderFailureDiagnostic;
}) {
  console.error(
    JSON.stringify({
      event: "solicitation_understanding_provider_failure",
      understandingId: input.understandingId,
      opportunityId: input.opportunityId,
      ...input.diagnostic,
    }),
  );
}
'''
          assert marker in text
          text = text.replace(marker, marker + helper, 1)

          old_state = '  let providerCallCount = 0;\n  let resolvedModelVersion = provider.modelVersion;'
          new_state = '  let providerCallCount = 0;\n  const providerFailures: UnderstandingProviderFailureDiagnostic[] = [];\n  let resolvedModelVersion = provider.modelVersion;'
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          old_chunk = '''    try {
      const result = await provider.generate(request);
      providerCallCount += 1;
      resolvedModelVersion = result.modelVersion ?? resolvedModelVersion;'''
          new_chunk = '''    providerCallCount += 1;
    try {
      const result = await provider.generate(request);
      resolvedModelVersion = result.modelVersion ?? resolvedModelVersion;'''
          assert old_chunk in text
          text = text.replace(old_chunk, new_chunk, 1)

          old_chunk_catch = '''    } catch {
      const remainingKeys = plannedChunks.slice(index).map((candidate) => candidate.chunkKey);
      await markUnderstandingChunksSkipped({'''
          new_chunk_catch = '''    } catch (error) {
      const diagnostic = describeProviderFailure({
        error,
        provider: provider.profile.provider,
        model: provider.profile.model,
        chunkKey: chunk.chunkKey,
      });
      providerFailures.push(diagnostic);
      logProviderFailure({ understandingId, opportunityId: input.opportunityId, diagnostic });
      const remainingKeys = plannedChunks.slice(index).map((candidate) => candidate.chunkKey);
      await markUnderstandingChunksSkipped({'''
          assert old_chunk_catch in text
          text = text.replace(old_chunk_catch, new_chunk_catch, 1)

          old_metadata = '''    try {
      const result = await provider.generate(request);
      providerCallCount += 1;
      resolvedModelVersion = result.modelVersion ?? resolvedModelVersion;'''
          new_metadata = '''    providerCallCount += 1;
    try {
      const result = await provider.generate(request);
      resolvedModelVersion = result.modelVersion ?? resolvedModelVersion;'''
          assert old_metadata in text
          text = text.replace(old_metadata, new_metadata, 1)

          old_metadata_catch = '''    } catch {
      await failSolicitationUnderstandingRun({
        understandingId,
        failureCode: "provider_failure",
        coverageMetadata: plan.coverage,
      });'''
          new_metadata_catch = '''    } catch (error) {
      const diagnostic = describeProviderFailure({
        error,
        provider: provider.profile.provider,
        model: provider.profile.model,
        chunkKey: null,
      });
      providerFailures.push(diagnostic);
      logProviderFailure({ understandingId, opportunityId: input.opportunityId, diagnostic });
      await failSolicitationUnderstandingRun({
        understandingId,
        failureCode: "provider_failure",
        coverageMetadata: plan.coverage,
        usageMetadata: {
          providerCallCount,
          thoughtsTokenCount,
          totalProviderTokenCount,
          providerFailures,
        },
      });'''
          assert old_metadata_catch in text
          text = text.replace(old_metadata_catch, new_metadata_catch, 1)

          old_no_output_usage = '      usageMetadata: { providerCallCount, thoughtsTokenCount, totalProviderTokenCount },'
          new_no_output_usage = '''      usageMetadata: {
        providerCallCount,
        thoughtsTokenCount,
        totalProviderTokenCount,
        providerFailures,
      },'''
          assert old_no_output_usage in text
          text = text.replace(old_no_output_usage, new_no_output_usage, 1)

          old_complete_usage = '''      providerCallCount,
      thoughtsTokenCount,
      totalProviderTokenCount,
      reusedChunkCount: reusedChunkKeys.size,'''
          new_complete_usage = '''      providerCallCount,
      thoughtsTokenCount,
      totalProviderTokenCount,
      reusedChunkCount: reusedChunkKeys.size,
      providerFailures,'''
          assert old_complete_usage in text
          text = text.replace(old_complete_usage, new_complete_usage, 1)

          path.write_text(text)
          PY

      - name: Commit production patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-patch-provider-observability.yml
          git add lib/procurement/understanding/generation.ts
          git commit -m "fix: persist provider failure diagnostics"
          git push origin HEAD:codex/understanding-provider-observability
