name: Manual solicitation understanding smoke

on:
  push:
    branches:
      - ops/manual-understanding-itb-2026-0020

permissions:
  contents: read

jobs:
  regenerate:
    name: Explicit manual Gemini regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_BILLING_MODE: ${{ vars.GEMINI_BILLING_MODE || 'billable' }}
      GOVTRACT_AI_MANUAL_BUDGET_USD: "0.25"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run one explicit manual regeneration
        run: |
          npx tsx -e '
            import { generateSolicitationUnderstanding } from "./lib/procurement/understanding/generation";
            import { closeDb } from "./lib/db/client";
            (async () => {
              try {
                const result = await generateSolicitationUnderstanding({
                  opportunityId: "22259ea2-bcc1-450e-b6ed-a35cf71ab218",
                  trigger: "manual",
                  explicitManualUserAction: true,
                });
                console.log(JSON.stringify({
                  state: result.state,
                  understandingId: "understandingId" in result ? result.understandingId : null,
                  reason: "reason" in result ? result.reason : null,
                  completenessStatus: "completenessStatus" in result ? result.completenessStatus : null
                }));
                if (result.state !== "completed" && result.state !== "reused") process.exitCode = 1;
              } finally {
                await closeDb();
              }
            })();
          '
