name: Gemini live smoke

on:
  push:
    branches:
      - codex/gemini-live-smoke

permissions:
  contents: read

jobs:
  smoke:
    name: Diagnose Gemini provider access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check Gemini model access
        shell: bash
        run: |
          status=$(curl -sS -o model-response.json -w '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash)
          echo "model_lookup_http_status=$status"
          if [ "$status" != "200" ]; then
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("model-response.json","utf8")); console.log("gemini_error="+(d?.error?.message ?? "unknown"));'
            exit 1
          fi
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("model-response.json","utf8")); console.log("model="+(d?.name ?? "unknown"));'

      - name: Check tiny structured-output request
        shell: bash
        run: |
          cat > request.json <<'JSON'
          {
            "contents": [{"parts": [{"text": "Return an object whose ok field is true."}]}],
            "generationConfig": {
              "maxOutputTokens": 64,
              "responseFormat": {
                "text": {
                  "mimeType": "application/json",
                  "schema": {
                    "type": "object",
                    "properties": {"ok": {"type": "boolean"}},
                    "required": ["ok"]
                  }
                }
              }
            }
          }
          JSON
          status=$(curl -sS -o generate-response.json -w '%{http_code}' \
            -X POST \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H 'content-type: application/json' \
            --data-binary @request.json \
            https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent)
          echo "generate_http_status=$status"
          if [ "$status" != "200" ]; then
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("generate-response.json","utf8")); console.log("gemini_error="+(d?.error?.message ?? "unknown"));'
            exit 1
          fi
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("generate-response.json","utf8")); console.log("model_version="+(d?.modelVersion ?? "unknown")); console.log("prompt_tokens="+(d?.usageMetadata?.promptTokenCount ?? 0)); console.log("output_tokens="+(d?.usageMetadata?.candidatesTokenCount ?? 0)); console.log("structured_output_received="+Boolean(d?.candidates?.[0]?.content?.parts?.[0]?.text));'
