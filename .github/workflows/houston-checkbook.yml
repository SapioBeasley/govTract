name: Houston Checkbook ingestion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Backfill historical resources or refresh the newest/current fiscal year
        required: true
        type: choice
        options:
          - refresh
          - backfill
        default: refresh
      fiscal_year:
        description: Optional fiscal year to bound the run (for example 2024)
        required: false
        default: ""
      page_size:
        description: CKAN rows per page
        required: true
        default: "1000"
      max_pages:
        description: Maximum pages to process in this run
        required: true
        default: "400"
      resume_resource:
        description: Optional resource ID from a prior checkpoint
        required: false
        default: ""
      resume_offset:
        description: Optional row offset from a prior checkpoint
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: houston-checkbook-production
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest City of Houston Open Checkbook
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate -- --baseline-existing

      - name: Run bounded Houston Checkbook ingestion
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "--mode=${{ inputs.mode }}"
            "--page-size=${{ inputs.page_size }}"
            "--max-pages=${{ inputs.max_pages }}"
          )

          if [ -n "${{ inputs.fiscal_year }}" ]; then
            args+=("--fiscal-year=${{ inputs.fiscal_year }}")
          fi

          if [ -n "${{ inputs.resume_resource }}" ] || [ -n "${{ inputs.resume_offset }}" ]; then
            if [ -z "${{ inputs.resume_resource }}" ] || [ -z "${{ inputs.resume_offset }}" ]; then
              echo "::error::resume_resource and resume_offset must be supplied together"
              exit 1
            fi
            args+=(
              "--resume-resource=${{ inputs.resume_resource }}"
              "--resume-offset=${{ inputs.resume_offset }}"
            )
          fi

          npm run ingest:houston-checkbook -- "${args[@]}"
