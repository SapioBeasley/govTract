name: Source connection branch checks

on:
  push:
    branches:
      - issue-67-source-connections

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:source-connections
      - run: npm run test:documents
      - run: npm run test:beacon-documents
