name: Beacon magic-link auth probe

on:
  workflow_dispatch:
    inputs:
      detail_url:
        description: Beacon solicitation detail URL used to test one individual document
        required: true
        default: https://www.beaconbid.com/solicitations/city-of-houston/892d339e-2dcb-4700-8d61-42785a5e0554/industrial-fire-brigade-structural-fire-trainer
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEACON_MAGIC_LINK: ${{ secrets.BEACON_MAGIC_LINK }}
      BEACON_PROBE_DETAIL_URL: ${{ inputs.detail_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify one-time secret is configured
        shell: bash
        run: |
          if [ -z "$BEACON_MAGIC_LINK" ]; then
            echo "::error::Repository Actions secret BEACON_MAGIC_LINK is missing. Add a fresh Beacon magic-login URL as that secret, then rerun this workflow."
            exit 1
          fi
          echo "::add-mask::$BEACON_MAGIC_LINK"
          echo "Beacon magic-link secret is configured and masked."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Probe Beacon authentication and individual document access
        run: node scripts/beacon-magic-link-probe.mjs
