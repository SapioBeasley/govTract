name: Beacon document endpoint probe

on:
  pull_request:
    paths:
      - ".github/workflows/beacon-document-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Beacon document transport
        shell: bash
        run: |
          set -u
          urls=(
            'https://assets.beaconbid.com/assets/js/vendor-C4W9vwQE.js'
            'https://assets.beaconbid.com/assets/js/grid-a_pcw8bM.js'
            'https://assets.beaconbid.com/assets/js/pdf-BNy7uOuR.js'
            'https://assets.beaconbid.com/assets/app-D7XUl6tg.js'
          )
          for url in "${urls[@]}"; do
            echo "=== $url"
            body=$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)
            echo "bytes=${#body}"
            matches=$(printf '%s' "$body" | grep -Eio '.{0,220}(presign|pre.?signed|signed.?url|documentSource|download[^a-z]|getobject|s3|bucket).{0,300}' | head -80 || true)
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches"
            fi
          done
