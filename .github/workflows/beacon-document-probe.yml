name: Beacon document endpoint probe

on:
  pull_request:
    paths:
      - ".github/workflows/beacon-document-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Beacon public document route
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          opp='8cd509cd-03bd-4069-86b0-c0a5ec742d5c'
          key='agency%2F281287c2-49c0-439e-81d7-315d13b0b4fb%2Fsolicitation%2F1784646506469_4a450af0-0b75-40cc-975e-d5c6f008694c%2FSignedRFP-2026-0014ParkingManagementSystem.pdf'
          route="https://www.beaconbid.com/api/planholder/document/$opp/$key"
          curl -sS -A "$ua" -c /tmp/cookies.txt 'https://www.beaconbid.com/api/rest/session' -o /tmp/session.json
          echo "session=$(cat /tmp/session.json)"
          status=$(curl -sS -A "$ua" -b /tmp/cookies.txt -L --range 0-0 -D /tmp/headers.txt -o /tmp/byte.bin -w '%{http_code}' "$route")
          echo "status=$status bytes=$(wc -c </tmp/byte.bin)"
          grep -Ei '^(HTTP/|location:|content-type:|content-length:|content-range:|content-disposition:)' /tmp/headers.txt || true
          if [ "$status" != '200' ] && [ "$status" != '206' ]; then
            exit 1
          fi
          test -s /tmp/byte.bin
