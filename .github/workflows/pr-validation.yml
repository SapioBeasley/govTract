name: PR validation

on:
  pull_request:
    paths:
      - ".github/workflows/pr-validation.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "drizzle/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.*"
      - "postcss.config.*"

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, migrations, and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govtract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/govtract_test
      # Deterministic 32-byte test key. This is intentionally non-secret and CI-only.
      SOURCE_SESSION_ENCRYPTION_KEY: "0707070707070707070707070707070707070707070707070707070707070707"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply migrations to isolated test database
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run deterministic test suite
        run: npm test
