name: Issue 69 live Beacon document validation

on:
  push:
    branches:
      - issue-69-beacon-auth-documents
    paths:
      - ".github/workflows/issue-69-live-documents.yml"

permissions:
  contents: read

jobs:
  live-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_SESSION_ENCRYPTION_KEY: ${{ secrets.SOURCE_SESSION_ENCRYPTION_KEY }}
      BEACON_AGENCY: city-of-houston
      BEACON_ARTIFACT_DIR: .artifacts/beacon
      BEACON_DOCUMENT_CONCURRENCY: "4"
      BEACON_DOCUMENT_MAX_BYTES: "314572800"
      BEACON_DOCUMENT_MAX_ERROR_RATE: "0.25"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check persisted-session configuration
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured"
            exit 1
          fi
          if [ -z "$SOURCE_SESSION_ENCRYPTION_KEY" ]; then
            echo "SOURCE_SESSION_ENCRYPTION_KEY is not configured"
            exit 1
          fi
          echo "Persisted Beacon source-session configuration is present"

      - name: Typecheck
        run: npm run typecheck

      - name: Test Beacon document helpers
        run: npm run test:beacon-documents

      - name: Retrieve and version Beacon documents
        run: npm run ingest:beacon:documents

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-69-beacon-documents-${{ github.run_id }}
          path: .artifacts/beacon
          if-no-files-found: warn
          retention-days: 7
