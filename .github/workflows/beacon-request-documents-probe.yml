name: Beacon Request Documents probe

on:
  push:
    branches:
      - probe-beacon-request-documents

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/beacon-request-documents-probe.mjs
