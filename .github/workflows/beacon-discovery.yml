name: Beacon opportunity pull

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum Beacon result pages to traverse
        required: false
        default: "100"
      page_size:
        description: GraphQL page size (50 matches Beacon; smaller values can verify pagination manually)
        required: false
        default: "50"
      persist:
        description: Persist the completed pull to Postgres
        required: true
        type: boolean
        default: true
      extract_documents:
        description: Extract supported document text after authenticated retrieval
        required: true
        type: boolean
        default: true
      generate_understandings:
        description: Attempt the one automatic solicitation-understanding cycle for eligible opportunities
        required: true
        type: boolean
        default: true
      extraction_backfill_limit:
        description: Maximum already-hashed documents to redownload for first-time extraction in this run
        required: false
        default: "25"
      document_closeout_limit:
        description: Maximum inactive document closeout items to process in this run
        required: false
        default: "25"
      understanding_generation_limit:
        description: Maximum opportunities to consider for automatic understanding in this run
        required: false
        default: "25"
      retry_failed_extractions:
        description: Retry canonical extraction failures from previous runs
        required: true
        type: boolean
        default: false
  schedule:
      - cron: "17 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: beacon-city-of-houston-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull:
    name: Pull City of Houston Beacon opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BEACON_START_URL: https://www.beaconbid.com/solicitations/city-of-houston/open
      BEACON_AGENCY: city-of-houston
      BEACON_MAX_PAGES: ${{ inputs.max_pages || '100' }}
      BEACON_PAGE_SIZE: ${{ inputs.page_size || '50' }}
      BEACON_PERSIST: ${{ (github.event_name == 'schedule' || inputs.persist) && 'true' || 'false' }}
      BEACON_ARTIFACT_DIR: .artifacts/beacon
      BEACON_AUTO_REGISTER: "true"
      BEACON_DOCUMENT_CONCURRENCY: "2"
      BEACON_DOCUMENT_MAX_BYTES: "314572800"
      BEACON_DOCUMENT_MAX_ERROR_RATE: "0.25"
      BEACON_DOCUMENT_EXTRACT: ${{ (github.event_name == 'schedule' || inputs.extract_documents) && 'true' || 'false' }}
      BEACON_EXTRACTION_BACKFILL_LIMIT: ${{ inputs.extraction_backfill_limit || '25' }}
      BEACON_DOCUMENT_CLOSEOUT_LIMIT: ${{ inputs.document_closeout_limit || '25' }}
      BEACON_DOCUMENT_CLOSEOUT_OPPORTUNITY_LIMIT: "100"
      BEACON_EXTRACTION_RETRY_FAILED: ${{ inputs.retry_failed_extractions && 'true' || 'false' }}
      BEACON_EXTRACTION_MAX_SOURCE_BYTES: "67108864"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_SESSION_ENCRYPTION_KEY: ${{ secrets.SOURCE_SESSION_ENCRYPTION_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_BILLING_MODE: ${{ vars.GEMINI_BILLING_MODE || 'billable' }}
      # Workflow-scoped paid-equivalent ceiling per opportunity. Local/app defaults remain $0.
      GOVTRACT_AI_AUTOMATIC_BUDGET_USD: "0.25"
      UNDERSTANDING_GENERATION_LIMIT: ${{ inputs.understanding_generation_limit || '25' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        if: github.event_name == 'schedule' || inputs.persist
        run: npm run db:migrate -- --baseline-existing

      - name: Pull Beacon opportunities
        run: npm run ingest:beacon

      - name: Retrieve, version, and extract Beacon documents
        if: github.event_name == 'schedule' || inputs.persist
        run: npm run ingest:beacon:documents

      - name: Finalize inactive Beacon document extraction
        if: (github.event_name == 'schedule' || inputs.persist) && (github.event_name == 'schedule' || inputs.extract_documents)
        run: npm run ingest:beacon:document-closeouts

      - name: Generate eligible solicitation understandings
        if: (github.event_name == 'schedule' || inputs.persist) && (github.event_name == 'schedule' || inputs.generate_understandings)
        run: npm run understand:opportunities

      - name: Upload sanitized Beacon diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-city-of-houston-${{ github.run_id }}
          path: .artifacts/beacon
          if-no-files-found: warn
          retention-days: 7
