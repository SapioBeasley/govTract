name: Issue 69 apply auto registration patch

on:
  push:
    branches:
      - issue-69-beacon-auth-documents
    paths:
      - ".github/workflows/issue-69-apply-auto-registration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-69-beacon-auth-documents
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escape target template interpolations in temporary patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/issue-69-apply-auto-registration-patch.mjs')
          s = p.read_text()
          for token in ['BEACON_ORIGIN', 'response.status', 'sourceOpportunityId']:
              s = s.replace('${' + token + '}', r'\${' + token + '}')
          p.write_text(s)
          PY
      - name: Apply patch
        run: node scripts/issue-69-apply-auto-registration-patch.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test Beacon documents
        run: npm run test:beacon-documents
      - name: Commit production script change
        run: |
          git config user.name "govTract automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/beacon-documents.ts
          git commit -m "Automatically register Beacon solicitations for documents"
          git push origin HEAD:issue-69-beacon-auth-documents
